# Add inside the server{} of /etc/nginx/sites-available/jc-round.scm-backoffice.conf,
# ABOVE the existing "location /api/" block (longest prefix wins either way, but keep it explicit).
location /api/drop/ {
    client_max_body_size 16m;
    proxy_request_buffering on;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://127.0.0.1:8093;   # no URI → full /api/drop/... path is forwarded
}
