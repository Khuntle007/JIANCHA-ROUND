# JC-ROUND v2 vhost — installed by cutover.sh as a SEPARATE file; the v1 file stays untouched for rollback.
server {
    listen 80;
    listen [::]:80;
    server_name jc-round.scm-backoffice.com;
    return 301 https://jc-round.scm-backoffice.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jc-round.scm-backoffice.com;

    ssl_certificate     /etc/nginx/ssl/scm-backoffice.com.pem;
    ssl_certificate_key /etc/nginx/ssl/scm-backoffice.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 16m;   # franchise PDF upload (app enforces 15 MB)
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;   # real client IP behind Cloudflare (rate limits / audit)
        proxy_read_timeout 90s;
        # Next.js builds absolute redirects from its internal listen address — rewrite them to the public origin
        proxy_redirect http://127.0.0.1:8094/ https://$host/;
        proxy_redirect https://127.0.0.1:8094/ https://$host/;
        proxy_redirect http://localhost:8094/ https://$host/;
        proxy_redirect https://localhost:8094/ https://$host/;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    access_log /var/log/nginx/jc-round.access.log;
    error_log  /var/log/nginx/jc-round.error.log;
}
