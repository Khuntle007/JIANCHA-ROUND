:root{

  --jc-font-body:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --jc-font-thai:'Sarabun','Noto Sans Thai',sans-serif;
  --ok:#2E7D46; --okbg:#E4F1E8; --bad:#C0392B; --badbg:#FBE7E4; --warn:#C9A227; --warnbg:#FBF3D9;
  --radius:2px; --maxw:1240px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--jc-bg);color:var(--jc-ink);font-family:var(--jc-font-thai);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:14px}
:lang(th),.th{font-family:var(--jc-font-thai)}
h1,h2,h3,.head{font-family:var(--jc-font-head);letter-spacing:.04em;text-transform:uppercase;margin:0}
a{color:inherit}
button{font-family:var(--jc-font-thai);cursor:pointer}
input,select,textarea{font-family:var(--jc-font-thai);font-size:14px}
.hidden{display:none!important}

.topbar{background:var(--jc-ink);color:#fff;display:flex;align-items:center;gap:1.2rem;padding:.7rem 1.2rem;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:.6rem}
.brand .emblem{width:34px;height:34px;color:var(--jc-gold)}
.brand .wm{font-family:var(--jc-font-head);font-weight:700;letter-spacing:.18em;font-size:1.05rem}
.brand .wm small{display:block;letter-spacing:.28em;font-size:.5rem;color:var(--jc-gold);font-family:var(--jc-font-body)}
.nav{display:flex;gap:.3rem;margin-left:1rem;flex-wrap:wrap}
.nav a{padding:.45rem .8rem;border-radius:var(--radius);font-size:.8rem;letter-spacing:.03em;text-decoration:none;color:#cfccc4;font-family:var(--jc-font-head);text-transform:uppercase}
.nav a.active,.nav a:hover{background:rgba(173,156,130,.22);color:#fff}
.topbar .spacer{flex:1}
.who{font-size:.78rem;color:#cfccc4;display:flex;align-items:center;gap:.6rem}
.who b{color:#fff}
.wrap{max-width:var(--maxw);margin:0 auto;padding:1.4rem 1.2rem 4rem}

/* generic */
.card{background:var(--jc-surface);border:1px solid var(--jc-border);border-radius:var(--radius);padding:1.2rem 1.3rem}
.card + .card{margin-top:1.1rem}
.rule{height:2px;width:52px;background:var(--jc-gold);border:0;margin:0 0 1rem}
.muted{color:var(--jc-stone)}
.small{font-size:.78rem}
.tag{display:inline-block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:.15em .55em;border-radius:2px;font-family:var(--jc-font-head)}
.tag.mt{background:var(--jc-ink);color:#fff} .tag.fc{background:var(--jc-gold);color:var(--jc-ink)}
.tag.dry{background:#4A3F2E;color:#fff} .tag.fresh{background:#2E7D46;color:#fff}
.btn{border:1px solid var(--jc-ink);background:var(--jc-ink);color:#fff;border-radius:var(--radius);padding:.5em 1.1em;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;font-family:var(--jc-font-head);transition:.15s}
.btn:hover{background:transparent;color:var(--jc-ink)}
.btn.gold{background:var(--jc-gold);border-color:var(--jc-gold);color:var(--jc-ink)}
.btn.gold:hover{background:transparent;color:#8a7b60}
.btn.ghost{background:transparent;color:var(--jc-ink)}
.btn.sm{padding:.32em .7em;font-size:.68rem}
.btn.danger{border-color:var(--bad);background:var(--bad)} .btn.danger:hover{color:var(--bad);background:transparent}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.7rem}
.field label{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--jc-stone);font-family:var(--jc-font-head)}
.field input,.field select,.field textarea{padding:.55em .7em;border:1px solid var(--jc-border);border-radius:var(--radius);background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--jc-gold);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 1rem}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--jc-border);vertical-align:middle}
th{font-family:var(--jc-font-head);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--jc-stone);background:#faf9f6}
.tblwrap{overflow-x:auto}
.status{border:0;border-radius:2px;padding:.35em .7em;font-size:.72rem;font-weight:600;font-family:var(--jc-font-thai);white-space:nowrap;cursor:pointer}
.status.ok{background:var(--okbg);color:var(--ok)} .status.bad{background:var(--badbg);color:var(--bad)} .status.hold{background:var(--warnbg);color:#9a7b12}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:.35em}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.hold{background:var(--warn)}

/* page head */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.pagehead h1{font-size:1.5rem}
.kicker{font-family:var(--jc-font-head);font-size:.68rem;letter-spacing:.16em;color:var(--jc-gold);text-transform:uppercase}

/* calendar */
/* home two-column layout */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.6rem;align-items:start}
@media(max-width:980px){.home-grid{grid-template-columns:1fr}}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .dow{font-family:var(--jc-font-head);font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;color:var(--jc-stone);text-align:center;padding:.2rem 0}
.cell{min-height:52px;border:1px solid var(--jc-border);border-radius:var(--radius);padding:.28rem .35rem;background:#fff;cursor:pointer;position:relative;transition:.12s}
.cell:hover{border-color:var(--jc-gold)}
.cell.out{background:#f4f2ec;color:#b7b3a9;cursor:default}
.cell.today{outline:2px solid var(--jc-gold);outline-offset:-2px}
.cell.holiday{background:#FBE7E4}
.cell .dnum{font-family:var(--jc-font-head);font-size:.85rem}
.cell .hname{font-size:.64rem;color:var(--bad);line-height:1.15;margin-top:2px}
.cell .hbadge{position:absolute;top:4px;right:5px;font-size:.6rem;color:var(--bad)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(24,24,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:3rem 1rem;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;padding:1.5rem 1.5rem 1.3rem;border-top:4px solid var(--jc-gold)}
.modal h2{font-size:1.1rem;margin-bottom:.2rem}
.modal .x{float:right;border:0;background:none;font-size:1.3rem;line-height:1;color:var(--jc-stone)}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--jc-cream);border-radius:2px;padding:.2em .5em;font-size:.72rem;margin:.15rem}
.scopebox{max-height:180px;overflow:auto;border:1px solid var(--jc-border);padding:.5rem;border-radius:var(--radius)}
.scopebox label{display:flex;gap:.4rem;align-items:center;font-size:.8rem;padding:.15rem 0;text-transform:none;letter-spacing:0;font-family:var(--jc-font-thai);color:var(--jc-ink)}

/* login */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--jc-ink);padding:2rem}
.loginbox{background:#fff;max-width:380px;width:100%;padding:2.2rem 2rem;border-radius:var(--radius);border-top:4px solid var(--jc-gold)}
.loginbox .emblem{width:52px;height:52px;color:var(--jc-gold)}

/* board group headers */
.grouphead{display:flex;align-items:center;gap:.5rem;margin:1.1rem 0 .3rem;font-family:var(--jc-font-head);text-transform:uppercase;letter-spacing:.05em;font-size:.85rem}
.grouphead .line{flex:1;height:1px;background:var(--jc-border)}
.empty{padding:1.4rem;text-align:center;color:var(--jc-stone);border:1px dashed var(--jc-border);border-radius:var(--radius)}
.pill{font-size:.7rem;background:var(--jc-cream);border-radius:20px;padding:.2em .7em;font-family:var(--jc-font-head);letter-spacing:.03em}
.banner{background:#FBF3D9;border:1px solid #E7D9A0;border-radius:var(--radius);padding:.7rem .9rem;font-size:.82rem;margin-bottom:1rem}
details.linegroup{border:1px solid var(--jc-border);border-radius:2px;margin-top:.55rem;background:#fff}
details.linegroup>summary{cursor:pointer;list-style:none;padding:.6rem .85rem;display:flex;align-items:center;gap:.6rem}
details.linegroup>summary::-webkit-details-marker{display:none}
details.linegroup>summary::after{content:'▾';margin-left:auto;color:var(--jc-stone);font-size:.8rem}
details.linegroup[open]>summary{border-bottom:1px solid var(--jc-border)}
details.linegroup[open]>summary::after{content:'▴'}
details.linegroup .tblwrap{padding:.2rem .5rem .5rem}
details.linegroup.isempty>summary{opacity:.5}
/* board tabs + day chips */
.board-tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem}
.btab{border:1px solid var(--jc-border);background:#fff;border-radius:2px;padding:.35rem .5rem;cursor:pointer;transition:.12s}
.btab:hover{border-color:var(--jc-gold)}
.btab.active{border-color:var(--jc-gold);background:var(--jc-cream);box-shadow:inset 0 -2px 0 var(--jc-gold)}
.board-days{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.2rem;border-top:1px solid var(--jc-border);padding-top:.7rem}
.dchip{border:1px solid var(--jc-border);background:#fff;border-radius:2px;padding:.35rem .7rem;cursor:pointer;font-family:var(--jc-font-head);font-size:.72rem;letter-spacing:.03em}
.dchip:hover{border-color:var(--jc-gold)}
.dchip.active{background:var(--jc-ink);color:#fff;border-color:var(--jc-ink)}
/* weekly rounds matrix */
table.wktbl th,table.wktbl td{text-align:center;font-size:.72rem;padding:.4rem .3rem}
table.wktbl td.wk-on{background:#F3EEE2}
table.wktbl td.wk-off{color:#c3bfb4}
table.wktbl .wk-dl{font-size:.62rem;color:var(--jc-stone);margin-top:1px}
/* nicer name column */
table.wktbl td.wk-name{text-align:left;white-space:normal;min-width:184px;padding:.6rem .7rem;border-left:3px solid transparent}
table.wktbl tbody tr:hover td.wk-name{border-left-color:var(--jc-gold);background:#faf9f6}
table.wktbl td.wk-name .tag{font-size:.66rem;letter-spacing:.03em}
.wk-prod{font-family:var(--jc-font-thai);font-size:.8rem;font-weight:600;color:var(--jc-ink);margin-top:.32rem;line-height:1.25}
.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);background:var(--jc-ink);color:#fff;padding:.7rem 1.2rem;border-radius:var(--radius);font-size:.82rem;z-index:200;border-left:3px solid var(--jc-gold);opacity:0;transition:.25s}
.toast.show{opacity:1}
.daychips span{display:inline-block;background:var(--jc-cream);border-radius:2px;padding:.1em .45em;margin:1px;font-size:.7rem}
.daychips span.off{background:#f4f2ec;color:#b7b3a9}
.expander{width:32px;height:32px;border:1px solid var(--jc-border);background:#fff;border-radius:2px;color:var(--jc-stone);font-size:.8rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:.18s}
.expander:hover{border-color:var(--jc-gold);color:var(--jc-ink)}
.expander.open{transform:rotate(180deg);border-color:var(--jc-gold);background:var(--jc-gold);color:var(--jc-ink)}
.expander.gear{margin-right:.35rem}
.expander.gear:hover{background:var(--jc-cream)}
tr.exprow td{border-bottom:2px solid var(--jc-gold)}
.foot{color:var(--jc-stone);font-size:.72rem;text-align:center;padding:2rem 1rem 1rem}
</style>
</head>

function jsDowToMon(d){return (d+6)%7} // JS 0=Sun -> our 0=Mon

/* ---------- round-slot helpers ----------
   แต่ละ "รอบสั่ง" (slot) = {order: วันสั่ง 0-6, cutoff: "HH:MM", deliver: วันรับ 0-6} */
function roundSlots(r){return Array.isArray(r.slots)?r.slots:[]}
function roundDeliverDays(r){return [...new Set(roundSlots(r).map(s=>s.deliver))]}
function roundOrderDays(r){return [...new Set(roundSlots(r).map(s=>s.order))]}
function slotForOrderDay(r,dow){return roundSlots(r).find(s=>s.order===dow)}
function lineMatch(r,L){return L.cat==='dry'?(r.category==='dry'&&r.warehouse===L.key):(r.category==='fresh'&&r.freshType===L.key)}
function migrateRound(r){
  if(Array.isArray(r.slots))return r;
  const m=(r.condition||'').match(/(\d{1,2})[.:](\d{2})/);
  const cutoff=m?(m[1].padStart(2,'0')+':'+m[2]):(r.category==='dry'?'15:00':'12:00');
  const dd=Array.isArray(r.deliveryDays)?r.deliveryDays:[];
  r.slots=dd.map(d=>({order:(d+6)%7,cutoff,deliver:d}));
  return r;
}
function migrateDB(){ if(DB&&DB.branches)DB.branches.forEach(b=>{(b.rounds||[]).forEach(migrateRound)}); }

function buildSeedRounds(days){
  const freshSlots=days.map(d=>({order:(d+6)%7,cutoff:'12:00',deliver:d}));
  const fresh=(ft,product)=>({id:uid('r'),category:'fresh',freshType:ft,warehouse:'',product,slots:freshSlots.map(s=>({...s}))});
  return [
    {id:uid('r'),category:'dry',freshType:'',warehouse:'WH001',product:'ของแห้ง–วัตถุดิบทั่วไป',slots:[{order:0,cutoff:'15:00',deliver:1},{order:3,cutoff:'15:00',deliver:4}]},
    {id:uid('r'),category:'dry',freshType:'',warehouse:'WH002',product:'ของแห้ง–บรรจุภัณฑ์ / อุปกรณ์',slots:[{order:2,cutoff:'15:00',deliver:4}]},
    fresh('นมสด','นมสดมาลี / เมจิ'),
    fresh('โยเกิร์ต','โยเกิร์ตพร้อมดื่ม'),
    fresh('วิปปิ้งครีม & ครีมชีส','วิปปิ้งครีม / ครีมชีส'),
    fresh('ผลไม้','ผลไม้สด'),
    fresh('ไอซ์ฮอต','ไอซ์ฮอต'),
  ];
}

function loadDB(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){DB=JSON.parse(raw);migrateDB();return}}catch(e){}
  DB=seedDB();saveDB();
}
function saveDB(){localStorage.setItem(LS_KEY,JSON.stringify(DB))}
function loadSession(){try{S=JSON.parse(sessionStorage.getItem(SS_KEY)||localStorage.getItem(SS_KEY)||'{}')}catch(e){S={}}}
function saveSession(){localStorage.setItem(SS_KEY,JSON.stringify(S))}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function esc(x){return (x==null?'':String(x)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function emblemSVG(){return $('#emblem-tpl').innerHTML}
function branchByCode(c){return DB.branches.find(b=>b.code===c)}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'})}
function sameMonth(iso,y,m){return iso.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`}
function curUser(){return DB.users.find(u=>u.id===S.uid)||null}
function canSeeBranch(u,code){if(!u)return false;if(u.role==='admin'||u.scope==='all')return true;return Array.isArray(u.scope)&&u.scope.includes(code)}
function visibleBranches(u){return DB.branches.filter(b=>canSeeBranch(u,b.code))}
function canEditBranch(u,code){return !!u&&(u.role==='admin'||(u.canEdit&&canSeeBranch(u,code)))}
function statusMeta(s){return s==='complete'?{cls:'ok',label:'Complete · ได้รับครบ'}:s==='cut'?{cls:'bad',label:'โดนตัด / ส่งไม่ครบ'}:{cls:'hold',label:'รอชำระเงิน (Hold)'}}

/* ---------- router ---------- */
function go(hash){location.hash=hash}
function parseHash(){
  const h=location.hash.replace(/^#/,'')||'/calendar';
  const [path,qs]=h.split('?');
  const parts=path.split('/').filter(Boolean);
  const q=Object.fromEntries(new URLSearchParams(qs||''));
  return {parts,q};
}

function render(){
  loadSession();
  // ---- SHARE MODE via ?branch=CODE (no login required) ----
  const url=new URLSearchParams(location.search);
  if(url.get('branch')){renderShare(url.get('branch'));return}

  const u=curUser();
  if(!u){renderLogin();return}

  const {parts}=parseHash();
  const route=parts[0]||'calendar';
  const app=$('#app');
  app.innerHTML=chrome(u,route);
  const main=$('#main');
  if(route==='branch') renderBranchDetail(main,u,parts[1]);
  else if(route==='users') renderUsers(main,u);
  else if(route==='branches') renderBranchList(main,u);
  else renderHome(main,u); // home / calendar -> ปฏิทิน + บอร์ด
  wireNav();
}

function chrome(u,route){
  const isAdmin=u.role==='admin';
  const homeActive=(route==='home'||route==='calendar')?'active':'';
  const branchesActive=(route==='branches'||route==='branch')?'active':'';
  const nav=`<a href="#/home" data-nav="home" class="${homeActive}">ปฏิทิน</a>`
    +`<a href="#/branches" data-nav="branches" class="${branchesActive}">สาขา</a>`
    +(isAdmin?`<a href="#/users" data-nav="users" class="${route==='users'?'active':''}">สิทธิ์ผู้ใช้</a>`:'');
  return `
  <div class="topbar">
    <div class="brand">${emblemSVG()}<div class="wm">JIANCHA<small>ROUNDS SYSTEM</small></div></div>
    <div class="nav">${nav}</div>
    <div class="spacer"></div>
    <div class="who"><span>${esc(u.name)} · <b>${roleLabel(u.role)}</b></span><button class="btn sm ghost" id="logoutBtn">ออกจากระบบ</button></div>
  </div>
  <div class="wrap"><div id="main"></div>
   <div class="foot">JIANCHA · ระบบรอบสั่ง–รอบส่ง — ต้นแบบ (ข้อมูลเก็บในเบราว์เซอร์นี้) · <a href="#" id="resetBtn" class="muted">รีเซ็ตข้อมูลตัวอย่าง</a></div>
  </div>`;
}
function roleLabel(r){return r==='admin'?'แอดมิน':r==='editor'?'ผู้แก้ไข':'ผู้ชม'}

function wireNav(){
  const lb=$('#logoutBtn');if(lb)lb.onclick=()=>{S={};saveSession();go('/calendar');render()};
  const rb=$('#resetBtn');if(rb)rb.onclick=(e)=>{e.preventDefault();confirmDialog('รีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าตัวอย่าง?',()=>{localStorage.removeItem(LS_KEY);loadDB();render();toast('รีเซ็ตข้อมูลแล้ว')},{danger:true,yes:'รีเซ็ต'});};

/* ===== บอร์ดรอบสั่ง: แท็บประเภทสินค้า + เลือกวัน จ.–อา. ===== */
let boardLine='WH001', boardDay=null;
function renderRoundsBoard(main,u){
  if(boardDay==null)boardDay=jsDowToMon(new Date().getDay());
  const LINES=affectedLines();
  if(!LINES.some(L=>L.key===boardLine))boardLine=LINES[0].key;
  main.innerHTML=`
    <div class="pagehead"><div><div class="kicker">ภาพรวมรอบสั่ง</div><h1>บอร์ดรอบสั่ง–รับของ</h1></div></div>
    <div class="card">
      <div class="board-tabs" id="boardTabs">${LINES.map(L=>`<button class="btab ${L.key===boardLine?'active':''}" data-line="${esc(L.key)}"><span class="tag ${L.cat}" style="pointer-events:none">${esc(L.label)}</span></button>`).join('')}</div>
      <div class="board-days" id="boardDays">${DOW_TH.map((d,i)=>`<button class="dchip ${i===boardDay?'active':''}" data-day="${i}">${d}</button>`).join('')}</div>
      <div id="boardBody"></div>
    </div>`;
  const drawBody=()=>{
    const L=LINES.find(x=>x.key===boardLine)||LINES[0];
    const list=visibleBranches(u).map(b=>{
      const r=(b.rounds||[]).find(rr=>lineMatch(rr,L));
      const s=r?slotForOrderDay(r,boardDay):null;
      return s?{b,s}:null;
    }).filter(Boolean);
    $('#boardBody').innerHTML=`
      <div class="grouphead" style="font-size:.82rem;margin-top:1rem"><span class="tag ${L.cat}">${esc(L.label)}</span> <span class="th">รอบสั่งของวัน${DOW_TH[boardDay]}</span><span class="line"></span><span class="pill">${list.length} สาขา</span></div>
      ${list.length?`<div class="tblwrap"><table><thead><tr><th>รหัส</th><th>สาขา</th><th>ต้องสั่งภายใน</th><th>จะได้รับของวัน</th></tr></thead><tbody>
        ${list.map(({b,s})=>`<tr><td class="small">${b.code}</td><td><a href="#/branch/${b.code}" class="th">${esc(b.nameEn)}</a></td><td class="th"><b>≤ ${esc(s.cutoff)} น.</b></td><td class="th">${DOW_TH[s.deliver]}</td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty th">ไม่มีสาขาที่มีรอบสั่ง <b>${esc(L.label)}</b> ในวัน${DOW_TH[boardDay]}</div>`}`;
  };
  $$('#boardTabs .btab').forEach(t=>t.onclick=()=>{boardLine=t.dataset.line;$$('#boardTabs .btab').forEach(x=>x.classList.toggle('active',x.dataset.line===boardLine));drawBody();});
  $$('#boardDays .dchip').forEach(t=>t.onclick=()=>{boardDay=+t.dataset.day;$$('#boardDays .dchip').forEach(x=>x.classList.toggle('active',+x.dataset.day===boardDay));drawBody();});
  drawBody();
}

let calY, calM;
function renderCalendar(main,u){
  const isAdmin=u.role==='admin';
  const now=new Date();
  if(calY==null){calY=now.getFullYear();calM=now.getMonth()}
  main.innerHTML=`
    <div class="pagehead">
      <div><div class="kicker">ปฏิทินการดำเนินงาน</div><h1>วันหยุด &amp; รอบจัดส่งเฉพาะกิจ</h1></div>
      <div class="row">
        <button class="btn ghost sm" id="prevM">‹ เดือนก่อน</button>
        <div class="pill" id="calLabel"></div>
        <button class="btn ghost sm" id="nextM">เดือนถัดไป ›</button>
      </div>
    </div>
    ${isAdmin?'<div class="banner th small">คลิกที่ช่องวันเพื่อ<strong>ตั้ง/ยกเลิกวันหยุด</strong> — สาขาที่ได้รับผลกระทบจะแสดงทางด้านขวา</div>':'<div class="banner th small">วันหยุดที่แอดมินกำหนด — สาขาที่ได้รับผลกระทบอยู่ด้านขวา</div>'}
    <div class="card" style="padding:.9rem"><div id="calGrid"></div></div>`;
  $('#prevM').onclick=()=>{calM--;if(calM<0){calM=11;calY--}drawCal(u)};
  $('#nextM').onclick=()=>{calM++;if(calM>11){calM=0;calY++}drawCal(u)};
  drawCal(u);
}
function drawCal(u){
  const isAdmin=u.role==='admin';
  $('#calLabel').textContent=new Date(calY,calM,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  const first=new Date(calY,calM,1); const startMon=jsDowToMon(first.getDay());
  const daysInM=new Date(calY,calM+1,0).getDate();
  let cells='';
  DOW_TH.forEach(d=>cells+=`<div class="dow">${d}</div>`);
  for(let i=0;i<startMon;i++)cells+=`<div class="cell out"></div>`;
  const tISO=todayISO();
  for(let d=1;d<=daysInM;d++){
    const iso=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hol=DB.holidays.find(h=>h.date===iso);
    cells+=`<div class="cell ${hol?'holiday':''} ${iso===tISO?'today':''}" data-date="${iso}">
      <div class="dnum">${d}</div>
      ${hol?`<div class="hbadge">●</div><div class="hname th">${esc(hol.name||'วันหยุด')}</div>`:''}
    </div>`;
  }
  $('#calGrid').innerHTML=`<div class="calgrid">${cells}</div>`;
  if(isAdmin){$$('#calGrid .cell[data-date]').forEach(c=>c.onclick=()=>toggleHoliday(c.dataset.date,u))}
  drawAffected(u);
}
function toggleHoliday(iso,u){ holidayModal(iso,u); }
function holidayModal(iso,u){
  const existing=DB.holidays.find(h=>h.date===iso);
  const dow=jsDowToMon(new Date(iso+'T00:00:00').getDay());
  openModal(`<div class="modal" style="max-width:460px"><button class="x" onclick="closeModal()">×</button>
    <h2>${existing?'แก้ไขวันหยุด':'ตั้งวันหยุด'}</h2>
    <div class="small muted th" style="margin-bottom:1rem">${fmtDate(iso)} · วัน${DOW_TH[dow]}</div>
    <div class="field"><label>ชื่อวันหยุด / เหตุผล</label><input id="hname" value="${esc(existing?existing.name:'')}" placeholder="เช่น วันสงกรานต์, ปิดปรับปรุง"></div>
    <div class="row" style="justify-content:space-between;margin-top:.6rem">
      <div>${existing?`<button class="btn danger sm" id="hdel">ลบวันหยุด</button>`:''}</div>
      <div class="row"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn gold" id="hsave">${existing?'บันทึก':'ตั้งวันหยุด'}</button></div>
    </div></div>`);
  const inp=$('#hname'); if(inp){inp.focus(); inp.onkeydown=e=>{if(e.key==='Enter')$('#hsave').click()}}
  $('#hsave').onclick=()=>{
    const name=$('#hname').value.trim()||'วันหยุด';
    if(existing){existing.name=name}else{DB.holidays.push({date:iso,name})}
    saveDB();closeModal();drawCal(u);toast(existing?'บันทึกวันหยุดแล้ว':'เพิ่มวันหยุดแล้ว');
  };
  const hd=$('#hdel'); if(hd)hd.onclick=()=>{DB.holidays=DB.holidays.filter(h=>h.date!==iso);DB.specials=DB.specials.filter(s=>s.date!==iso);saveDB();closeModal();drawCal(u);toast('ยกเลิกวันหยุดแล้ว')};
}
function affectedLines(){
  return [...WAREHOUSES.map(w=>({key:w,label:w,cat:'dry'})),
          ...FRESH_TYPES.map(f=>({key:f,label:f,cat:'fresh'}))];
}
function branchAffectedByLine(b,L,dow){
  return (b.rounds||[]).some(r=>lineMatch(r,L)&&roundDeliverDays(r).includes(dow));
}
function drawAffected(u){
  const isAdmin=u.role==='admin';
  const box=$('#affected');
  const hols=DB.holidays.filter(h=>sameMonth(h.date,calY,calM)).sort((a,b)=>a.date<b.date?-1:1);
  if(!hols.length){box.innerHTML=`<div class="card"><div class="empty th">ยังไม่มีวันหยุดในเดือนนี้</div></div>`;return}
  const scope=visibleBranches(u);
  const LINES=affectedLines();
  let html='';
  hols.forEach(h=>{
    const dow=jsDowToMon(new Date(h.date+'T00:00:00').getDay());
    const affectedAny=scope.filter(b=>(b.rounds||[]).some(r=>roundDeliverDays(r).includes(dow)));
    html+=`<div class="card">
      <div class="grouphead"><span style="color:var(--bad)">⚠</span> ${fmtDate(h.date)} · <span class="th">${esc(h.name)}</span> <span class="muted small th">(วัน${DOW_TH[dow]})</span><span class="line"></span><span class="pill">${affectedAny.length} สาขากระทบ</span></div>
      <p class="small muted th" style="margin:.3rem 0 .5rem">แยกตามประเภทสินค้า — กดที่แต่ละประเภทเพื่อดูรายชื่อสาขาและกำหนดรอบจัดส่งเฉพาะกิจ</p>`;
    let opened=false;
    LINES.forEach((L)=>{
      const branches=scope.filter(b=>branchAffectedByLine(b,L,dow));
      const isEmpty=!branches.length;
      const openAttr=(!isEmpty&&!opened)?'open':''; if(!isEmpty&&!opened)opened=true;
      html+=`<details class="linegroup${isEmpty?' isempty':''}" ${openAttr}><summary><span class="tag ${L.cat}">${esc(L.label)}</span><span class="th small muted">${isEmpty?'ไม่กระทบ':(branches.length+' สาขากระทบ')}</span></summary>`;
      if(isEmpty){
        html+=`<div class="empty th small" style="border:0;margin:.35rem .5rem">— ไม่มีสาขากระทบในวันนี้ (สินค้านี้ไม่มีรอบส่งวัน${DOW_TH[dow]}) —</div>`;
      }else{
        html+=`<div class="tblwrap"><table><thead><tr><th>รหัส</th><th>สาขา</th><th>รอบจัดส่งเฉพาะกิจ (เลื่อนเป็น)</th><th>หมายเหตุ</th></tr></thead><tbody>`;
        branches.forEach(b=>{
          const sp=DB.specials.find(s=>s.date===h.date&&s.branch===b.code&&s.line===L.key)||{};
          html+=`<tr>
            <td class="small">${b.code}</td>
            <td><a href="#/branch/${b.code}" class="th">${esc(b.nameEn)}</a></td>
            <td>${isAdmin?`<input type="date" data-sp-date="${h.date}" data-sp-branch="${b.code}" data-sp-line="${esc(L.key)}" value="${sp.newDate||''}" style="padding:.3em">`:`<span class="th">${sp.newDate?fmtDate(sp.newDate):'—'}</span>`}</td>
            <td>${isAdmin?`<input type="text" data-note-date="${h.date}" data-note-branch="${b.code}" data-note-line="${esc(L.key)}" value="${esc(sp.note||'')}" placeholder="หมายเหตุ" style="padding:.3em;width:100%">`:`<span class="th small">${esc(sp.note||'—')}</span>`}</td>
          </tr>`;
        });
        html+=`</tbody></table></div>`;
      }
      html+=`</details>`;
    });
    html+=`</div>`;
  });
  box.innerHTML=html;
  if(isAdmin){
    $$('#affected input[data-sp-date]').forEach(inp=>inp.onchange=()=>saveSpecial(inp.dataset.spDate,inp.dataset.spBranch,inp.dataset.spLine,{newDate:inp.value}));
    $$('#affected input[data-note-date]').forEach(inp=>inp.onchange=()=>saveSpecial(inp.dataset.noteDate,inp.dataset.noteBranch,inp.dataset.noteLine,{note:inp.value}));
  }
}
function saveSpecial(date,branch,line,patch){
  let s=DB.specials.find(x=>x.date===date&&x.branch===branch&&x.line===line);
  if(!s){s={date,branch,line,newDate:'',note:''};DB.specials.push(s)}
  Object.assign(s,patch);saveDB();toast('บันทึกรอบเฉพาะกิจแล้ว');
}

          ${canEditBranch(u,b.code)?`<button class="expander gear" data-cfg="${b.code}" title="ตั้งค่ารอบสั่ง–ส่ง">⚙</button>`:''}
          <button class="expander" data-exp="${b.code}" aria-expanded="false" title="ดูรอบสั่ง–รอบส่ง">▾</button>
        </td>
      </tr>`;
    }).join(''):`<tr><td colspan="5" class="empty th" style="border:0">ไม่พบสาขาที่ตรงกับ "${esc(term)}"</td></tr>`;
    $$('#btbl [data-exp]').forEach(btn=>btn.onclick=()=>toggleExp(btn));
    $$('#btbl [data-cfg]').forEach(btn=>btn.onclick=()=>{
      const b=branchByCode(btn.dataset.cfg);
      branchRoundsModal(b,()=>{const eb=document.querySelector(`[data-exp="${b.code}"]`);if(eb&&eb.getAttribute('aria-expanded')==='true'){eb.click();eb.click();}});
    });
  };
  draw();
  $('#bsearch').oninput=e=>draw(e.target.value);
  if(isAdmin)$('#addBranch').onclick=()=>editBranchModal(null,u);
}
function toggleExp(btn){
  const row=btn.closest('tr');
  const open=btn.getAttribute('aria-expanded')==='true';
  const next=row.nextElementSibling;
  if(open){if(next&&next.classList.contains('exprow'))next.remove();btn.setAttribute('aria-expanded','false');btn.classList.remove('open');return}
  // close any other open row (accordion-style, optional: keep single open)
  const b=branchByCode(btn.dataset.exp);
  const tr=document.createElement('tr');tr.className='exprow';
  tr.innerHTML=`<td colspan="5" style="padding:0;background:#faf9f6"><div style="padding:.7rem 1rem 1rem">${roundsMini(b)}</div></td>`;
  row.after(tr);
  btn.setAttribute('aria-expanded','true');btn.classList.add('open');
}
function sortedRounds(b){
  const order={WH001:1,WH002:2};
  return (b.rounds||[]).slice().sort((x,y)=>{
    if(x.category!==y.category)return x.category==='dry'?-1:1;
    if(x.category==='dry')return (order[x.warehouse]||9)-(order[y.warehouse]||9);
    return FRESH_TYPES.indexOf(x.freshType)-FRESH_TYPES.indexOf(y.freshType);
  });
}
/* ตารางรอบสั่งรายสัปดาห์ จ.–อา. (แถว = สินค้า, คอลัมน์ = วัน) */
function roundsWeekTable(b){
  const rounds=sortedRounds(b);
  if(!rounds.length)return '';
  const head=`<tr><th style="text-align:left">สินค้า</th>${DOW_TH.map(d=>`<th style="text-align:center">${d}</th>`).join('')}</tr>`;
  const body=rounds.map(r=>{
    const label=r.category==='dry'?`<span class="tag dry">${esc(r.warehouse)}</span>`:`<span class="tag fresh">${esc(r.freshType)}</span>`;
    const cells=DOW_TH.map((d,i)=>{
      const s=slotForOrderDay(r,i);
      return s?`<td class="wk-on"><b>≤${esc(s.cutoff)}</b><div class="wk-dl">รับ ${DOW_SHORT[s.deliver]}</div></td>`:`<td class="wk-off">—</td>`;
    }).join('');
    return `<tr><td class="wk-name">${label}<div class="wk-prod">${esc(r.product)}</div></td>${cells}</tr>`;
  }).join('');
  return `<div class="tblwrap"><table class="wktbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <div class="small muted th" style="margin-top:.45rem">วิธีอ่าน: ช่องวัน = <b>วันสั่ง</b> · <b>“≤เวลา”</b> = ต้องสั่งภายในเวลานั้น · <b>“รับ (วัน)”</b> = ได้รับของวันนั้น · <b>“—”</b> = วันนั้นไม่มีรอบสั่ง</div>`;
}
function roundsMini(b){
  if(!(b.rounds||[]).length)return `<div class="empty th small" style="border:0">ยังไม่มีรอบสั่ง–ส่ง <a href="#/branch/${b.code}">เพิ่มที่หน้าสาขา ›</a></div>`;
  return `<div class="grouphead" style="font-size:.72rem;margin:.2rem 0 .5rem">รอบสั่ง–รับของรายสัปดาห์ · <span class="th">${esc(b.nameEn)}</span><span class="line"></span><a href="#/branch/${b.code}" class="btn sm ghost">ดูหน้าสาขา ›</a></div>
  ${roundsWeekTable(b)}`;
}

/* ----- ORDERS board (PO/TR) ----- */
function drawOrders(b,u,opt){
  opt=opt||{};
  const canEdit=u.role==='admin'||(u.canEdit&&canSeeBranch(u,b.code));
  const shareMode=opt.scope==='share';
  let list=DB.orders.filter(o=>o.branch===b.code);
  // share / viewer default: current month only (by order date)
  if(shareMode){const n=new Date();list=list.filter(o=>sameMonth(o.orderDate,n.getFullYear(),n.getMonth()))}
  list.sort((a,b)=>a.orderDate<b.orderDate?1:a.orderDate>b.orderDate?-1:0);
  const dry=list.filter(o=>o.category==='dry');
  const freshGroups=FRESH_TYPES.map(ft=>({ft,items:list.filter(o=>o.category==='fresh'&&o.freshType===ft)})).filter(g=>g.items.length);

  const orderTable=(items)=>`<div class="tblwrap"><table>
    <thead><tr><th>วันที่สั่ง</th><th>เลข TR/PO</th><th>คลัง/ชนิด</th><th>ชื่อสินค้า</th><th>วันที่ส่ง</th><th>สถานะ</th><th>หมายเหตุ</th>${canEdit&&!shareMode?'<th></th>':''}</tr></thead>
    <tbody>${items.map(o=>{
      const sm=statusMeta(o.status);
      return `<tr>
        <td class="small">${fmtDate(o.orderDate)}</td>
        <td><b class="small">${esc(o.docType)}</b><div class="small muted">${esc(o.docNo)}</div></td>
        <td class="small th">${o.category==='dry'?esc(o.warehouse):esc(o.freshType)}</td>
        <td class="th">${esc(o.product)}</td>
        <td class="small">${fmtDate(o.deliveryDate)}</td>
        <td><span class="status ${sm.cls}" ${canEdit&&!shareMode?`data-cyc="${o.id}"`:''} title="${canEdit&&!shareMode?'คลิกเพื่อเปลี่ยนสถานะ':''}"><span class="dot ${sm.cls}"></span>${sm.label}</span></td>
        <td class="small th muted">${esc(o.note||'—')}</td>
        ${canEdit&&!shareMode?`<td class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-edit-o="${o.id}">แก้</button><button class="btn sm ghost" data-del-o="${o.id}">ลบ</button></td>`:''}
      </tr>`}).join('')}</tbody></table></div>`;

  let html=`<div class="card"><div class="grouphead">ออเดอร์ที่สาขาสั่ง (PO / TR)`;
  if(shareMode)html+=` <span class="pill">เฉพาะเดือนนี้</span>`;
  html+=`<span class="line"></span>${canEdit&&!shareMode?`<button class="btn sm gold" id="addOrder">+ เพิ่มออเดอร์</button>`:''}</div>`;
  if(!list.length){html+=`<div class="empty th">ยังไม่มีออเดอร์${shareMode?'ในเดือนนี้':''}</div>`}
  else{
    html+=`<div class="grouphead" style="font-size:.75rem"><span class="tag dry">ของแห้ง</span><span class="line"></span></div>`;
    html+= dry.length?orderTable(dry):`<div class="empty th small">— ไม่มีรายการของแห้ง —</div>`;
    freshGroups.forEach(g=>{
      html+=`<div class="grouphead" style="font-size:.75rem"><span class="tag fresh">ของสด</span> <span class="th">${esc(g.ft)}</span><span class="line"></span></div>`+orderTable(g.items);
    });
    if(!freshGroups.length){html+=`<div class="grouphead" style="font-size:.75rem"><span class="tag fresh">ของสด</span><span class="line"></span></div><div class="empty th small">— ไม่มีรายการของสด —</div>`}
  }
  html+=`</div>`;
  $('#ordersCard').innerHTML=html;

  if(canEdit&&!shareMode){
    const ab=$('#addOrder');if(ab)ab.onclick=()=>orderModal(b,null);
    $$('#ordersCard [data-edit-o]').forEach(x=>x.onclick=()=>orderModal(b,DB.orders.find(o=>o.id===x.dataset.editO)));
    $$('#ordersCard [data-del-o]').forEach(x=>x.onclick=()=>confirmDialog('ลบออเดอร์นี้?',()=>{DB.orders=DB.orders.filter(o=>o.id!==x.dataset.delO);saveDB();drawOrders(b,u,opt);toast('ลบแล้ว')},{danger:true,yes:'ลบ'}));
    $$('#ordersCard [data-cyc]').forEach(x=>x.onclick=()=>{
      const o=DB.orders.find(o=>o.id===x.dataset.cyc);
      const order=['complete','cut','hold'];o.status=order[(order.indexOf(o.status)+1)%3];
      if(o.status==='complete')o.note='';saveDB();drawOrders(b,u,opt);
    });
  }
}

  openModal(`<div class="modal"><button class="x" onclick="closeModal()">×</button>
    <h2>${isNew?'เพิ่มสาขาใหม่':'แก้ไขข้อมูลสาขา'}</h2><div class="small muted" style="margin-bottom:1rem">${b.code}</div>
    <div class="grid2">
      <div class="field"><label>รหัสสาขา</label><input id="f_code" value="${esc(b.code)}" ${isNew?'':'readonly'}></div>

      <div class="field"><label>ชื่อสาขา (อังกฤษ)</label><input id="f_en" value="${esc(b.nameEn)}"></div>
      <div class="field"><label>ชื่อสาขา (ไทย)</label><input id="f_th" value="${esc(b.nameTh)}"></div>
      <div class="field"><label>เบอร์โทรสาขา</label><input id="f_phone" value="${esc(b.phone)}"></div>
      <div class="field"><label>AM ที่ดูแล</label><input id="f_am" value="${esc(b.am)}"></div>
      <div class="field"><label>บริษัทเจ้าของ</label><input id="f_company" value="${esc(b.company)}"></div>
      <div class="field"><label>เปิดร้านตั้งแต่</label><input id="f_open" type="date" value="${esc(b.openDate)}"></div>
    </div>
    <div class="field"><label>ที่อยู่</label><textarea id="f_addr" rows="2">${esc(b.address)}</textarea></div>
    <div class="grid2">
      <div class="field"><label>เงื่อนไขห้าง/เวลาเข้า</label><input id="f_mall" value="${esc(b.mallCondition)}"></div>
      <div class="field"><label>ลิงก์พิกัดแผนที่</label><input id="f_map" value="${esc(b.mapUrl)}"></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:.5rem">
      ${!isNew&&u.role==='admin'?`<button class="btn danger sm" id="delBranch">ลบสาขา</button>`:''}
      <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn gold" id="saveBranch">บันทึก</button>
    </div></div>`);
  $('#saveBranch').onclick=()=>{
    const code=$('#f_code').value.trim();
    if(!code||!$('#f_en').value.trim()){toast('กรุณากรอกรหัสและชื่อสาขา');return}
    if(isNew&&branchByCode(code)){toast('รหัสสาขานี้มีอยู่แล้ว');return}
    Object.assign(b,{code,nameEn:$('#f_en').value.trim(),nameTh:$('#f_th').value.trim(),type:$('#f_type').value,
      phone:$('#f_phone').value.trim(),am:$('#f_am').value.trim(),company:$('#f_company').value.trim(),
      openDate:$('#f_open').value,address:$('#f_addr').value.trim(),mallCondition:$('#f_mall').value.trim(),mapUrl:$('#f_map').value.trim()});
    if(isNew)DB.branches.push(b);

function branchRoundsModal(b,onSaved,opts){opts=opts||{};

    </div>`;};
  const rowHTML=(r)=>{
    r=r||{category:'fresh',warehouse:'WH001',freshType:'นมสด',product:'',slots:[{order:0,cutoff:'12:00',deliver:1}]};
    return `<div class="rndrow" style="border:1px solid var(--jc-border);border-radius:2px;padding:.75rem .85rem;margin-bottom:.7rem;background:#faf9f6">
      <div class="grid3">

        <div class="field rr-ftwrap"><label>ชนิดของสด</label><select class="rr-ft">${FRESH_TYPES.map(f=>`<option ${r.freshType===f?'selected':''}>${f}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>ชื่อสินค้า</label><input class="rr-prod" value="${esc(r.product)}" placeholder="เช่น นมสดมาลี / เมจิ"></div>
      <div class="field"><label>รอบสั่ง — สั่งวันไหน ภายในกี่โมง รับของวันไหน</label>
        <div class="sl-list">${(r.slots||[]).map(slotRowHTML).join('')}</div>
        <button class="btn sm ghost sl-add" style="margin-top:.3rem">+ เพิ่มรอบสั่ง (อีกวัน)</button>
      </div>
      <div class="row" style="justify-content:flex-end"><button class="btn danger sm rr-del">ลบสินค้านี้</button></div>
    </div>`;
  };
  openModal(`<div class="modal" style="max-width:720px"><button class="x" onclick="closeModal()">×</button>
    <h2>ตั้งค่ารอบสั่ง–รับของ</h2><div class="small muted th" style="margin-bottom:.2rem">${esc(b.nameEn)} · ${b.code}</div>
    <p class="small muted th" style="margin:.2rem 0 1rem">แต่ละสินค้า กำหนดได้ว่า <b>สั่งวันไหน · ภายในกี่โมง · รับของวันไหน</b> (เพิ่มได้หลายวันต่อสัปดาห์)</p>
    <div id="rrList">${(b.rounds||[]).map(rowHTML).join('')}</div>
    <button class="btn ghost sm" id="rrAdd" style="margin-bottom:1rem">+ เพิ่มสินค้า</button>
    <div class="row" style="justify-content:flex-end;border-top:1px solid var(--jc-border);padding-top:.9rem">
      <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn gold" id="rrSave">บันทึกทั้งหมด</button>
    </div></div>`);
  const wireSlot=(sr)=>{ sr.querySelector('.sl-del').onclick=()=>sr.remove(); };
  const wireRow=(el)=>{
    const sync=()=>{const dry=el.querySelector('.rr-cat').value==='dry';
      el.querySelector('.rr-whwrap').style.display=dry?'':'none';
      el.querySelector('.rr-ftwrap').style.display=dry?'none':'';};
    el.querySelector('.rr-cat').onchange=sync;sync();
    el.querySelector('.rr-del').onclick=()=>el.remove();
    el.querySelectorAll('.slotrow').forEach(wireSlot);
    el.querySelector('.sl-add').onclick=()=>{const t=document.createElement('div');t.innerHTML=slotRowHTML();const sr=t.firstElementChild;el.querySelector('.sl-list').appendChild(sr);wireSlot(sr);};
  };
  $$('#rrList .rndrow').forEach(wireRow);
  $('#rrAdd').onclick=()=>{const t=document.createElement('div');t.innerHTML=rowHTML();const el=t.firstElementChild;$('#rrList').appendChild(el);wireRow(el);el.scrollIntoView({block:'center'});el.querySelector('.rr-prod').focus();};

  $('#rrSave').onclick=()=>{
    const rounds=[];
    $$('#rrList .rndrow').forEach(el=>{

      const prod=el.querySelector('.rr-prod').value.trim();

      const slots=[...el.querySelectorAll('.slotrow')].map(sr=>({
        order:+sr.querySelector('.sl-order').value,
        cutoff:sr.querySelector('.sl-cut').value||'12:00',
        deliver:+sr.querySelector('.sl-deliver').value}));
      rounds.push({id:uid('r'),category:cat,

        freshType:cat==='fresh'?el.querySelector('.rr-ft').value:'',
        product:prod,slots});
    });
    b.rounds=rounds;saveDB();closeModal();toast('บันทึกรอบสั่ง–รับของแล้ว');if(onSaved)onSaved();
  };
}

      <div class="pagehead"><div><div class="kicker">${b.code} · ลิงก์เฉพาะสาขา</div><h1 class="th">${esc(b.nameEn)}</h1>${b.nameTh?`<div class="muted th">${esc(b.nameTh)}</div>`:''}</div></div>
      <div id="infoCard"></div><div id="roundsCard"></div><div id="ordersCard"></div>
      <div class="foot">JIANCHA · ลิงก์นี้แสดงเฉพาะข้อมูลสาขา ${esc(b.code)} และออเดอร์เดือนปัจจุบันเท่านั้น</div>
    </div>`;
  drawBranchInfo(b);
  drawRounds(b,false);
  drawOrders(b,{role:'viewer',scope:[code],canEdit:false},{scope:'share'});
}

/* ---------- boot ---------- */
loadDB();
window.addEventListener('hashchange',render);
render();
</script>
</body>
