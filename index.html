<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIANCHA · ระบบรอบสั่ง–รอบส่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Montserrat:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap');
:root{
  --jc-ink:#181818; --jc-gold:#AD9C82; --jc-stone:#545351; --jc-cream:#E0DDD3; --jc-white:#fff;
  --jc-bg:#F3F1EB; --jc-surface:#fff; --jc-border:rgba(84,83,81,.18);
  --jc-font-head:'Helios Extended','Archivo','Helvetica Neue',Arial,sans-serif;
  --jc-font-body:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --jc-font-thai:'Sarabun','Noto Sans Thai',sans-serif;
  --ok:#2E7D46; --okbg:#E4F1E8; --bad:#C0392B; --badbg:#FBE7E4; --warn:#C9A227; --warnbg:#FBF3D9;
  --radius:2px; --maxw:1240px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--jc-bg);color:var(--jc-ink);font-family:var(--jc-font-thai);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:14px}
:lang(th),.th{font-family:var(--jc-font-thai)}
h1,h2,h3,.head{font-family:var(--jc-font-head);letter-spacing:.04em;text-transform:uppercase;margin:0}
a{color:inherit}
button{font-family:var(--jc-font-thai);cursor:pointer}
input,select,textarea{font-family:var(--jc-font-thai);font-size:14px}
.hidden{display:none!important}

/* layout */
.topbar{background:var(--jc-ink);color:#fff;display:flex;align-items:center;flex-wrap:wrap;gap:.6rem 1.2rem;padding:.7rem 1.2rem;position:sticky;top:0;z-index:50}
@media(max-width:640px){
  .topbar{gap:.5rem .7rem;padding:.6rem .8rem}
  .topbar .spacer{display:none}
  .who{order:2;margin-left:auto}
  .nav{order:3;width:100%;margin-left:0}
}
.brand{display:flex;align-items:center;gap:.6rem}
.brand .emblem{width:34px;height:34px;color:var(--jc-gold)}
.brand .wm{font-family:var(--jc-font-head);font-weight:700;letter-spacing:.18em;font-size:1.05rem}
.brand .wm small{display:block;letter-spacing:.28em;font-size:.5rem;color:var(--jc-gold);font-family:var(--jc-font-body)}
.nav{display:flex;gap:.3rem;margin-left:1rem;flex-wrap:wrap}
.nav a{padding:.45rem .8rem;border-radius:var(--radius);font-size:.8rem;letter-spacing:.03em;text-decoration:none;color:#cfccc4;font-family:var(--jc-font-head);text-transform:uppercase}
.nav a.active,.nav a:hover{background:rgba(173,156,130,.22);color:#fff}
.topbar .spacer{flex:1}
.who{font-size:.78rem;color:#cfccc4;display:flex;align-items:center;gap:.6rem}
.who b{color:#fff}
.wrap{max-width:var(--maxw);margin:0 auto;padding:1.4rem 1.2rem 4rem}

/* generic */
.card{background:var(--jc-surface);border:1px solid var(--jc-border);border-radius:var(--radius);padding:1.2rem 1.3rem}
.card + .card{margin-top:1.1rem}
.rule{height:2px;width:52px;background:var(--jc-gold);border:0;margin:0 0 1rem}
.muted{color:var(--jc-stone)}
.small{font-size:.78rem}
.tag{display:inline-block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:.15em .55em;border-radius:2px;font-family:var(--jc-font-head)}
.tag.mt{background:var(--jc-ink);color:#fff} .tag.fc{background:var(--jc-gold);color:var(--jc-ink)}
.tag.dry{background:#4A3F2E;color:#fff} .tag.fresh{background:#2E7D46;color:#fff}
.btn{border:1px solid var(--jc-ink);background:var(--jc-ink);color:#fff;border-radius:var(--radius);padding:.5em 1.1em;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;font-family:var(--jc-font-head);transition:.15s}
.btn:hover{background:transparent;color:var(--jc-ink)}
.btn.gold{background:var(--jc-gold);border-color:var(--jc-gold);color:var(--jc-ink)}
.btn.gold:hover{background:transparent;color:#8a7b60}
.btn.ghost{background:transparent;color:var(--jc-ink)}
.topbar .btn.ghost{color:#fff;border:1px solid rgba(255,255,255,.55)}
.topbar .btn.ghost:hover{background:rgba(255,255,255,.12)}
/* logout sits on the dark topbar — ghost's ink text would be black-on-black (invisible); force a light outline */
#logoutBtn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
#logoutBtn:hover{background:#fff;color:var(--jc-ink);border-color:#fff}
.btn.sm{padding:.32em .7em;font-size:.68rem}
.btn.danger{border-color:var(--bad);background:var(--bad)} .btn.danger:hover{color:var(--bad);background:transparent}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.7rem}
.field label{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--jc-stone);font-family:var(--jc-font-head)}
.field input,.field select,.field textarea{padding:.55em .7em;border:1px solid var(--jc-border);border-radius:var(--radius);background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--jc-gold);outline-offset:-1px}
.pside-layout{display:flex;gap:1.5rem;align-items:flex-start}
.pside{width:160px;flex:none;position:sticky;top:76px;display:flex;flex-direction:column;gap:.2rem}
.pside a{display:block;padding:.6rem .8rem;border-left:3px solid transparent;color:var(--jc-stone);font-family:var(--jc-font-thai);text-decoration:none}
.pside a:hover{background:#ece9e1}
.pside a.on{border-left-color:var(--jc-gold);background:#fff;color:var(--jc-ink);font-weight:700}
.pmain{flex:1;min-width:0}
@media(max-width:720px){.pside-layout{flex-direction:column;gap:.6rem}.pside{width:100%;position:static;flex-direction:row;overflow:auto}.pside a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}.pside a.on{border-bottom-color:var(--jc-gold)}}
.msel{position:relative;min-width:190px}
.msel-btn{width:100%;text-align:left;padding:.55em .7em;border:1px solid var(--jc-border);border-radius:var(--radius);background:#fff;cursor:pointer;display:flex;justify-content:space-between;gap:.5rem;font:inherit;color:var(--jc-ink)}
.msel-btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel-btn .ph{color:#777}
.msel-panel{position:absolute;z-index:40;left:0;min-width:100%;width:max-content;max-width:340px;top:100%;margin-top:2px;background:#fff;border:1px solid var(--jc-border);box-shadow:0 6px 18px rgba(0,0,0,.14);display:none}
.msel.open .msel-panel{display:block}
.msel-panel input[type=search]{width:calc(100% - 1rem);margin:.5rem;padding:.45em .6em;border:1px solid var(--jc-border);border-radius:var(--radius)}
.msel-list{max-height:260px;overflow:auto}
.msel-list label{display:flex;gap:.5rem;align-items:center;padding:.4rem .7rem;cursor:pointer;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--jc-ink);font-family:inherit}
.msel-list label:hover{background:#faf9f6}
.msel-tools{display:flex;justify-content:space-between;gap:1rem;padding:.1rem .7rem .4rem;font-size:.78rem}
.msel-tools a{color:var(--jc-stone);cursor:pointer;text-decoration:underline}
.rptbar{display:flex;flex-wrap:wrap;gap:.6rem .8rem;align-items:flex-end;margin-bottom:.9rem}
.rptbar .field{margin:0}
.rptsum{display:flex;gap:1.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.rptsum b{font-size:1.15rem;display:block}
.rpt td.num,.rpt th.num{text-align:right;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 1rem}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--jc-border);vertical-align:middle}
th{font-family:var(--jc-font-head);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--jc-stone);background:#faf9f6}
.tblwrap{overflow-x:auto}
.status{border:0;border-radius:2px;padding:.35em .7em;font-size:.72rem;font-weight:600;font-family:var(--jc-font-thai);white-space:nowrap;cursor:pointer}
.status.ok{background:var(--okbg);color:var(--ok)} .status.bad{background:var(--badbg);color:var(--bad)} .status.hold{background:var(--warnbg);color:#9a7b12}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:.35em}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.hold{background:var(--warn)}

/* page head */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.pagehead h1{font-size:1.5rem}
.kicker{font-family:var(--jc-font-head);font-size:.68rem;letter-spacing:.16em;color:var(--jc-gold);text-transform:uppercase}

/* calendar */
/* home two-column layout */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.6rem;align-items:start}
@media(max-width:980px){.home-grid{grid-template-columns:1fr}}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .dow{font-family:var(--jc-font-head);font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;color:var(--jc-stone);text-align:center;padding:.2rem 0}
.cell{min-height:52px;border:1px solid var(--jc-border);border-radius:var(--radius);padding:.28rem .35rem;background:#fff;cursor:pointer;position:relative;transition:.12s}
.cell:hover{border-color:var(--jc-gold)}
.cell.out{background:#f4f2ec;color:#b7b3a9;cursor:default}
.cell.today{outline:2px solid var(--jc-gold);outline-offset:-2px}
.cell.holiday{background:#FBE7E4}
.cell .dnum{font-family:var(--jc-font-head);font-size:.85rem}
.cell .hname{font-size:.64rem;color:var(--bad);line-height:1.15;margin-top:2px}
.cell .hbadge{position:absolute;top:4px;right:5px;font-size:.6rem;color:var(--bad)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(24,24,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:3rem 1rem;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;padding:1.5rem 1.5rem 1.3rem;border-top:4px solid var(--jc-gold)}
.modal h2{font-size:1.1rem;margin-bottom:.2rem}
.modal .x{float:right;border:0;background:none;font-size:1.3rem;line-height:1;color:var(--jc-stone)}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--jc-cream);border-radius:2px;padding:.2em .5em;font-size:.72rem;margin:.15rem}
.scopebox{max-height:180px;overflow:auto;border:1px solid var(--jc-border);padding:.5rem;border-radius:var(--radius)}
.scopebox label{display:flex;gap:.4rem;align-items:center;font-size:.8rem;padding:.15rem 0;text-transform:none;letter-spacing:0;font-family:var(--jc-font-thai);color:var(--jc-ink)}

/* login */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--jc-ink);padding:2rem}
.loginbox{background:#fff;max-width:380px;width:100%;padding:2.2rem 2rem;border-radius:var(--radius);border-top:4px solid var(--jc-gold)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.5rem}
.pinkey{height:54px;font-size:1.3rem;border:1px solid var(--jc-border);background:#fff;border-radius:4px;cursor:pointer;font-family:var(--jc-font-head);color:var(--jc-ink);transition:.1s}
.pinkey:hover{border-color:var(--jc-gold);background:var(--jc-cream)}
.pinkey:active{background:var(--jc-gold);color:var(--jc-ink)}
.pindot{width:14px;height:14px;border-radius:50%;border:2px solid var(--jc-stone);display:inline-block}
.pindot.on{background:var(--jc-ink);border-color:var(--jc-ink)}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--jc-border);margin:0 0 1rem;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:.6rem .9rem;font-family:var(--jc-font-head);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--jc-stone);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--jc-ink);border-bottom-color:var(--jc-gold)}
.linkbox{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;background:#faf9f6;border:1px dashed var(--jc-gold);padding:.6rem .8rem;border-radius:var(--radius)}
.linkbox code{font-size:.82rem;word-break:break-all;flex:1;min-width:200px}
.credbox{background:var(--jc-ink);color:#fff;padding:1rem 1.1rem;border-radius:var(--radius);font-family:ui-monospace,Menlo,monospace;font-size:.95rem;line-height:1.9}
.credbox span{color:var(--jc-gold);font-family:var(--jc-font-head);font-size:.66rem;letter-spacing:.12em;display:inline-block;width:6.5rem}
.estat{display:inline-block;font-size:.68rem;padding:.2em .55em;border-radius:2px;white-space:nowrap}
.estat.sent{background:var(--okbg);color:var(--ok)} .estat.failed{background:var(--badbg);color:var(--bad)} .estat.wait{background:var(--warnbg);color:#9a7b12}
.dropzone{border:2px dashed var(--jc-border);border-radius:4px;padding:1.4rem 1rem;text-align:center;cursor:pointer;background:#faf9f6;transition:.12s}
.dropzone.over,.dropzone:hover{border-color:var(--jc-gold);background:#fff}
.dropzone.has{border-style:solid;border-color:var(--jc-gold);background:#fff}
table.permtbl{width:100%;border-collapse:collapse}
table.permtbl th{text-align:center;font-size:.62rem;white-space:nowrap;padding:.5rem .35rem;vertical-align:bottom;border-bottom:1px solid rgba(84,83,81,.22)}
table.permtbl td{text-align:center;padding:.5rem .35rem;vertical-align:middle;border-bottom:1px solid rgba(84,83,81,.12)}
table.permtbl tbody tr:last-child td{border-bottom:0}
table.permtbl tr.inactive{opacity:.5}
.permcell{width:17px;height:17px;cursor:pointer;accent-color:var(--jc-gold)}
.scopebox .u_perm{accent-color:var(--jc-gold)}
.userpick{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;padding:.7rem .9rem;border:1px solid var(--jc-border);background:#fff;border-radius:4px;cursor:pointer;transition:.12s;font-family:var(--jc-font-thai)}
.userpick:hover{border-color:var(--jc-gold);background:var(--jc-cream)}
.loginbox.shake{animation:jcshake .4s}
@keyframes jcshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.loginbox .emblem{width:52px;height:52px;color:var(--jc-gold)}

/* board group headers */
.grouphead{display:flex;align-items:center;gap:.5rem;margin:1.1rem 0 .3rem;font-family:var(--jc-font-head);text-transform:uppercase;letter-spacing:.05em;font-size:.85rem}
.grouphead .line{flex:1;height:1px;background:var(--jc-border)}
.empty{padding:1.4rem;text-align:center;color:var(--jc-stone);border:1px dashed var(--jc-border);border-radius:var(--radius)}
.pill{font-size:.7rem;background:var(--jc-cream);border-radius:20px;padding:.2em .7em;font-family:var(--jc-font-head);letter-spacing:.03em}
.banner{background:#FBF3D9;border:1px solid #E7D9A0;border-radius:var(--radius);padding:.7rem .9rem;font-size:.82rem;margin-bottom:1rem}
details.linegroup{border:1px solid var(--jc-border);border-radius:2px;margin-top:.55rem;background:#fff}
details.linegroup>summary{cursor:pointer;list-style:none;padding:.6rem .85rem;display:flex;align-items:center;gap:.6rem}
details.linegroup>summary::-webkit-details-marker{display:none}
details.linegroup>summary::after{content:'▾';margin-left:auto;color:var(--jc-stone);font-size:.8rem}
details.linegroup[open]>summary{border-bottom:1px solid var(--jc-border)}
details.linegroup[open]>summary::after{content:'▴'}
details.linegroup .tblwrap{padding:.2rem .5rem .5rem}
details.linegroup.isempty>summary{opacity:.5}
/* board tabs + day chips */
.board-tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem}
.btab{border:1px solid var(--jc-border);background:#fff;border-radius:2px;padding:.35rem .5rem;cursor:pointer;transition:.12s}
.btab:hover{border-color:var(--jc-gold)}
.btab.active{border-color:var(--jc-gold);background:var(--jc-cream);box-shadow:inset 0 -2px 0 var(--jc-gold)}
.board-days{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.2rem;border-top:1px solid var(--jc-border);padding-top:.7rem}
.dchip{border:1px solid var(--jc-border);background:#fff;border-radius:2px;padding:.35rem .7rem;cursor:pointer;font-family:var(--jc-font-head);font-size:.72rem;letter-spacing:.03em}
.dchip:hover{border-color:var(--jc-gold)}
.dchip.active{background:var(--jc-ink);color:#fff;border-color:var(--jc-ink)}
/* weekly rounds matrix */
table.wktbl th,table.wktbl td{text-align:center;font-size:.72rem;padding:.4rem .3rem}
table.wktbl td.wk-on{background:#F3EEE2}
table.wktbl td.wk-off{color:#c3bfb4}
table.wktbl .wk-dl{font-size:.62rem;color:var(--jc-stone);margin-top:1px}
/* nicer name column */
table.wktbl td.wk-name{text-align:left;white-space:normal;min-width:184px;padding:.6rem .7rem;border-left:3px solid transparent}
table.wktbl tbody tr:hover td.wk-name{border-left-color:var(--jc-gold);background:#faf9f6}
table.wktbl td.wk-name .tag{font-size:.66rem;letter-spacing:.03em}
.wk-prod{font-family:var(--jc-font-thai);font-size:.8rem;font-weight:600;color:var(--jc-ink);margin-top:.32rem;line-height:1.25}
.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);background:var(--jc-ink);color:#fff;padding:.7rem 1.2rem;border-radius:var(--radius);font-size:.82rem;z-index:200;border-left:3px solid var(--jc-gold);opacity:0;transition:.25s}
.toast.show{opacity:1}
.daychips span{display:inline-block;background:var(--jc-cream);border-radius:2px;padding:.1em .45em;margin:1px;font-size:.7rem}
.daychips span.off{background:#f4f2ec;color:#b7b3a9}
.expander{width:32px;height:32px;border:1px solid var(--jc-border);background:#fff;border-radius:2px;color:var(--jc-stone);font-size:.8rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:.18s}
.expander:hover{border-color:var(--jc-gold);color:var(--jc-ink)}
.expander.open{transform:rotate(180deg);border-color:var(--jc-gold);background:var(--jc-gold);color:var(--jc-ink)}
.expander.gear{margin-right:.35rem}
.expander.gear:hover{background:var(--jc-cream)}
tr.exprow td{border-bottom:2px solid var(--jc-gold)}
.foot{color:var(--jc-stone);font-size:.72rem;text-align:center;padding:2rem 1rem 1rem}
</style>
</head>
<body>

<!-- ================= APP ROOT ================= -->
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<!-- inline emblem template -->
<template id="emblem-tpl">
<svg class="emblem" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="JIANCHA">
<g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">

<path d="M56 148 q14 -8 26 0 t26 0 t26 0"/>
</g></svg>
</template>

<script>
/* ============================================================
   JIANCHA · ระบบรอบสั่ง–รอบส่ง (Prototype v1)
   เก็บข้อมูลใน localStorage · ไฟล์เดียว
   ============================================================ */

const SEED_BRANCHES = [

  {code:"JC021",nameEn:"One Bangkok ชั้น5",pattern:"1111100"},
  {code:"JC022",nameEn:"Unilever ชั้น1",pattern:"1111010"},

function roundSlots(r){return Array.isArray(r.slots)?r.slots:[]}

function migrateRound(r){
  if(Array.isArray(r.slots))return r;
  const m=(r.condition||'').match(/(\d{1,2})[.:](\d{2})/);
  const cutoff=m?(m[1].padStart(2,'0')+':'+m[2]):(r.category==='dry'?'15:00':'12:00');
  const dd=Array.isArray(r.deliveryDays)?r.deliveryDays:[];

}

    const hasFresh=ft=>b.rounds.some(r=>r.category==='fresh'&&r.freshType===ft);
    if(!hasDry('WH001')) b.rounds.push({id:uid('r'),category:'dry',warehouse:'WH001',freshType:'',product:'ของแห้ง'+REVIEW_MARK,review:true,slots:CTI_SLOTS1.map(s=>({...s}))});
    if(!hasDry('WH003')) b.rounds.push({id:uid('r'),category:'dry',warehouse:'WH003',freshType:'',product:'สินค้า Frozen'+REVIEW_MARK,review:true,slots:[[1,3],[3,5],[4,1]].map(p=>({order:p[0],cutoff:'',deliver:p[1]}))});
    if(!hasFresh('โยเกิร์ต')) b.rounds.push({id:uid('r'),category:'fresh',warehouse:'',freshType:'โยเกิร์ต',product:'โยเกิร์ต'+REVIEW_MARK,review:true,slots:fSlotsOrder('1010000')});
    if(!hasFresh('วิปปิ้งครีม & ครีมชีส')) b.rounds.push({id:uid('r'),category:'fresh',warehouse:'',freshType:'วิปปิ้งครีม & ครีมชีส',product:'วิปปิ้งครีม / ครีมชีส'+REVIEW_MARK,review:true,slots:fSlotsDeliver('1101000')});
  });
}
// แก้ตรรกะข้ามสุดสัปดาห์ให้ "ของสด" ที่เคยบันทึกไว้ (รอบเก่าคำนวณ สั่ง=ส่ง−1 / ส่ง=สั่ง+1 แบบตายตัว จึงมีสั่งวันอาทิตย์/ส่งวันเสาร์ที่ผิด)
function fixFreshWeekend(db){
  const DELIVER_BASED=['นมสด','วิปปิ้งครีม & ครีมชีส'];
  (db.branches||[]).forEach(b=>(b.rounds||[]).forEach(r=>{
    if(r.category!=='fresh'||!Array.isArray(r.slots))return;
    if(DELIVER_BASED.includes(r.freshType)) r.slots.forEach(s=>{ s.order=orderDayFor(s.deliver); });
    else if(r.freshType==='โยเกิร์ต') r.slots.forEach(s=>{ s.deliver=deliverDayFor(s.order); });
  }));
}
// ผลไม้ BKK/ปริมณฑล: ส่งถึงเสาร์เท่านั้น (ไม่ส่งวันอาทิตย์) — เอา slot ที่ส่งวันอาทิตย์ออกจากข้อมูลเก่า (พัทยา/ระยองไม่มีอยู่แล้ว จึงไม่กระทบ)
function fixFruitSunday(db){
  (db.branches||[]).forEach(b=>(b.rounds||[]).forEach(r=>{
    if(r.category==='fresh'&&r.freshType==='ผลไม้'&&Array.isArray(r.slots)) r.slots=r.slots.filter(s=>s.deliver!==6);
  }));
}
// ผลไม้ BKK/ปริมณฑล: ส่งจันทร์–ศุกร์ (ไม่ส่งเสาร์-อาทิตย์), ส่งจันทร์→สั่งศุกร์ — สร้างรอบใหม่ให้ถูก (เว้นพัทยา/ระยองที่มีรอบเฉพาะ)
function fixFruitWeekdays(db){
  const PY=['JC052','JC048']; // พัทยา/ระยอง ไม่แตะ
  (db.branches||[]).forEach(b=>{
    if(PY.includes(b.code))return;
    (b.rounds||[]).forEach(r=>{ if(r.category==='fresh'&&r.freshType==='ผลไม้') r.slots=fSlotsDeliver('1111100'); });
  });
}
// เอาข้อความในวงเล็บออกจากชื่อสินค้าฝั่งคลัง (ของแห้ง) เช่น "ของแห้ง (คลัง CTI)" → "ของแห้ง", "สินค้า Frozen (HAVI)" → "สินค้า Frozen" (คง ⚠️รอตรวจสอบ ไว้)
function stripDryParen(db){
  (db.branches||[]).forEach(b=>(b.rounds||[]).forEach(r=>{
    if(r.category==='dry'&&typeof r.product==='string') r.product=r.product.replace(/\s*\([^)]*\)/,'');
  }));
}
// เอาเครื่องหมาย "⚠️รอตรวจสอบ" ออกจากชื่อสินค้าทุกรายการ (และล้าง flag review)
function stripReviewMark(db){
  (db.branches||[]).forEach(b=>(b.rounds||[]).forEach(r=>{
    if(typeof r.product==='string') r.product=r.product.replace(/\s*⚠️\s*รอตรวจสอบ/g,'').trim();
    if(r.review) delete r.review;
  }));
}
function migrateDB(){
  if(DB&&DB.branches)DB.branches.forEach(b=>{(b.rounds||[]).forEach(migrateRound)});
  if(DB&&DB.users)DB.users.forEach(u=>{if(u.active===undefined)u.active=true;if(!u.perms||typeof u.perms!=='object')u.perms=defaultPermsForRole(u.role);});
  if(DB){ if(!DB.meta)DB.meta={};
    if(!DB.meta.freshV1){ applyFreshRounds(DB); DB.meta.freshV1=true; }
    if(!DB.meta.ctiV1){ applyCTIRounds(DB); DB.meta.ctiV1=true; }
    if(!DB.meta.haviV1){ applyHaviRounds(DB); DB.meta.haviV1=true; }
    if(!DB.meta.fillV1){ fillDefaultRounds(DB); DB.meta.fillV1=true; }
    if(!DB.meta.freshV2){ fixFreshWeekend(DB); DB.meta.freshV2=true; }
    if(!DB.meta.freshV3){ fixFruitSunday(DB); DB.meta.freshV3=true; }
    if(!DB.meta.freshV4){ fixFruitWeekdays(DB); DB.meta.freshV4=true; }
    if(!DB.meta.dryNamesV1){ stripDryParen(DB); DB.meta.dryNamesV1=true; }
    if(!DB.meta.reviewMarkV1){ stripReviewMark(DB); DB.meta.reviewMarkV1=true; }
    if(!DB.meta.orderDropV1){ (DB.users||[]).forEach(u=>{if(isAdminRole(u.role)&&u.perms&&u.perms.orderDrop===undefined)u.perms.orderDrop=true;}); DB.meta.orderDropV1=true; }
  }
}

const API='/api';
let AUTH_TOKEN=null;
// โหลดข้อมูลจากเซิร์ฟเวอร์กลาง (PIN + ข้อมูลซิงก์ทุกเครื่อง); ถ้าเซิร์ฟเวอร์ล่ม ใช้ cache ในเครื่องชั่วคราว
async function loadDB(){
  try{
    const r=await fetch(API+'/state',{cache:'no-store'});
    const j=await r.json();
    if(j.init && j.state){ DB=j.state; migrateDB(); try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){} return; }
    // ยังไม่เคยตั้งค่า → สร้างข้อมูลตั้งต้นแล้วอัปขึ้นเซิร์ฟเวอร์ (ครั้งเดียว)
    DB=seedDB(); migrateDB();
    await fetch(API+'/seed',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({db:DB})});
    try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){} return;
  }catch(e){
    try{const raw=localStorage.getItem(LS_KEY);if(raw){DB=JSON.parse(raw);migrateDB();return}}catch(_){}
    DB=seedDB();migrateDB();
  }
}
let _saveT=null;
function saveDB(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){}
  if(!AUTH_TOKEN)return; // ยังไม่ล็อกอิน = บันทึกขึ้นเซิร์ฟเวอร์ไม่ได้
  clearTimeout(_saveT);
  _saveT=setTimeout(()=>{
    fetch(API+'/state',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AUTH_TOKEN},body:JSON.stringify({db:DB})})
      .then(r=>{if(!r.ok)throw 0;}).catch(()=>toast('บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ'));
  },400);
}
function loadSession(){try{S=JSON.parse(localStorage.getItem(SS_KEY)||'{}')}catch(e){S={}} AUTH_TOKEN=(S&&S.token)||null;}
function saveSession(){try{localStorage.setItem(SS_KEY,JSON.stringify(S));}catch(e){} AUTH_TOKEN=(S&&S.token)||null;}

function isoToDMY(iso){if(!iso)return '';const p=(iso+'').split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:'';}
function dmyToISO(s){const m=(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return '';const d=+m[1],mo=+m[2],y=+m[3];if(mo<1||mo>12||d<1||d>31)return '';return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

/* ---------- router ---------- */
function go(hash){location.hash=hash}
function parseHash(){
  const h=location.hash.replace(/^#/,'')||'/calendar';
  const [path,qs]=h.split('?');
  const parts=path.split('/').filter(Boolean);
  const q=Object.fromEntries(new URLSearchParams(qs||''));
  return {parts,q};
}

function render(){
  // ---- EXTERNAL ORDER DROP portal (#/drop) — separate login, never touches back office ----
  if(parseHash().parts[0]==='drop'){renderPortal();return}
  if(!DB){loadDB().then(render);return}
  if(typeof APP_TITLE!=='undefined')document.title=APP_TITLE;
  loadSession();
  // ---- SHARE MODE via ?branch=CODE (no login required) ----
  const url=new URLSearchParams(location.search);
  if(url.get('branch')){renderShare(url.get('branch'));return}

  const u=curUser();
  if(!u){renderLogin();return}

  const {parts}=parseHash();
  let route=parts[0]||'calendar';
  // สิทธิ์เข้าถึงหน้า
  if(route==='users'&&!can('manageUsers'))route='home';
  if(route==='drops'&&!can('orderDrop'))route='home';
  if((route==='branches'||route==='branch')&&!can('branches'))route=can('calendar')?'home':'branches';
  if((route==='home'||route==='calendar')&&!can('calendar'))route=can('branches')?'branches':'home';
  const app=$('#app');
  app.innerHTML=chrome(u,route);
  const main=$('#main');
  if(route==='branch'&&can('branches')) renderBranchDetail(main,u,parts[1]);
  else if(route==='users'&&can('manageUsers')) renderUsers(main,u);
  else if(route==='drops'&&can('orderDrop')) renderDrops(main,u);
  else if(route==='branches'&&can('branches')) renderBranchList(main,u);
  else if(can('calendar')) renderHome(main,u);
  else main.innerHTML=`<div class="card"><div class="empty th">บัญชีของคุณยังไม่ได้รับสิทธิ์เข้าถึงหน้าใด ๆ — ติดต่อผู้ดูแลระบบ</div></div>`;
  wireNav();
}

   <div class="foot">JIANCHA · ระบบรอบสั่ง–รอบส่ง — ข้อมูลซิงก์ผ่านเซิร์ฟเวอร์กลาง · <a href="#" id="resetBtn" class="muted">รีเฟรชข้อมูล</a></div>
  </div>`;
}

        if(r.ok&&j.token){ const pin=pinBuf; S={uid:u.id,token:j.token}; saveSession(); await dropAdminSession(u,pin); finishLogin(u); return; }
        pinBuf='';drawDots();$('#pinMsg').textContent='PIN ไม่ถูกต้อง';shake();return;
      }catch(e){ pinBuf='';drawDots();$('#pinMsg').textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';shake();return; }
    }
    if(mode==='set1'){ loginFirstPin=pinBuf; loginPhase='set2'; renderLogin(); return; }
    if(mode==='set2'){
      if(pinBuf===loginFirstPin){
        try{
          const r=await fetch(API+'/setpin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:u.id,pin:pinBuf})});
          const j=await r.json().catch(()=>({}));
          if(r.ok&&j.token){ const pin=pinBuf; u.hasPin=true; S={uid:u.id,token:j.token}; saveSession(); await dropAdminSession(u,pin); finishLogin(u); return; }
          loginFirstPin='';loginPhase='set1';pinBuf='';renderLogin();$('#pinMsg').textContent=(j&&j.error==='pin already set')?'ผู้ใช้นี้ตั้ง PIN ไว้แล้ว':'ตั้ง PIN ไม่สำเร็จ';shake();return;
        }catch(e){ loginFirstPin='';loginPhase='set1';pinBuf='';renderLogin();$('#pinMsg').textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';shake();return; }
      }
      loginFirstPin=''; loginPhase='set1'; pinBuf='';
      renderLogin(); $('#pinMsg').textContent='PIN ไม่ตรงกัน ลองใหม่'; shake(); return;
    }
  };
  const press=(k)=>{
    if(!$('#pinDots'))return;
    $('#pinMsg').textContent='';
    if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);drawDots();return;}
    if(pinBuf.length>=4)return;
    pinBuf+=k;drawDots();
    if(pinBuf.length===4)setTimeout(submit,140);
  };
  drawDots();
  $$('.pinkey').forEach(b=>b.onclick=()=>press(b.dataset.k));
  $('#pinBack').onclick=(e)=>{e.preventDefault();loginUserId=null;loginPhase=null;loginFirstPin='';document.onkeydown=null;renderLogin();};
  document.onkeydown=e=>{if(!$('#pinDots'))return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');};
}

function drawCal(u){

  for(let d=1;d<=daysInM;d++){

function toggleExp(btn){
  const row=btn.closest('tr');
  const open=btn.getAttribute('aria-expanded')==='true';
  const next=row.nextElementSibling;
  if(open){if(next&&next.classList.contains('exprow'))next.remove();btn.setAttribute('aria-expanded','false');btn.classList.remove('open');return}
  // close any other open row (accordion-style, optional: keep single open)
  const b=branchByCode(btn.dataset.exp);
  const tr=document.createElement('tr');tr.className='exprow';
  tr.innerHTML=`<td colspan="5" style="padding:0;background:#faf9f6"><div style="padding:.7rem 1rem 1rem">${roundsMini(b)}</div></td>`;
  row.after(tr);
  btn.setAttribute('aria-expanded','true');btn.classList.add('open');
}
function sortedRounds(b){
  const order={WH001:1,WH002:2};
  return (b.rounds||[]).slice().sort((x,y)=>{
    if(x.category!==y.category)return x.category==='dry'?-1:1;
    if(x.category==='dry')return (order[x.warehouse]||9)-(order[y.warehouse]||9);
    return FRESH_TYPES.indexOf(x.freshType)-FRESH_TYPES.indexOf(y.freshType);
  });
}
/* ตารางรอบสั่งรายสัปดาห์ จ.–อา. (แถว = สินค้า, คอลัมน์ = วัน) */
function roundsWeekTable(b){
  const rounds=sortedRounds(b);
  if(!rounds.length)return '';
  const head=`<tr><th style="text-align:left">สินค้า</th>${DOW_TH.map(d=>`<th style="text-align:center">${d}</th>`).join('')}</tr>`;
  const body=rounds.map(r=>{
    const label=r.category==='dry'?`<span class="tag dry">${esc(r.warehouse)}</span>`:`<span class="tag fresh">${esc(r.freshType)}</span>`;
    const cells=DOW_TH.map((d,i)=>{
      const s=slotForOrderDay(r,i);
      return s?`<td class="wk-on"><b>${s.cutoff?'≤'+esc(s.cutoff):'สั่ง'}</b><div class="wk-dl">รับ ${DOW_SHORT[s.deliver]}</div></td>`:`<td class="wk-off">—</td>`;
    }).join('');
    return `<tr><td class="wk-name">${label}<div class="wk-prod">${esc(r.product)}</div></td>${cells}</tr>`;
  }).join('');
  return `<div class="tblwrap"><table class="wktbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>

/* ----- ORDERS board (PO/TR) ----- */
function drawOrders(b,u,opt){
  opt=opt||{};
  const canEdit=can('editOrders');
  const shareMode=opt.scope==='share';
  let list=DB.orders.filter(o=>o.branch===b.code);
  // share / viewer default: current month only (by order date)
  if(shareMode){const n=new Date();list=list.filter(o=>sameMonth(o.orderDate,n.getFullYear(),n.getMonth()))}
  list.sort((a,b)=>a.orderDate<b.orderDate?1:a.orderDate>b.orderDate?-1:0);
  const dry=list.filter(o=>o.category==='dry');
  const freshGroups=FRESH_TYPES.map(ft=>({ft,items:list.filter(o=>o.category==='fresh'&&o.freshType===ft)})).filter(g=>g.items.length);

  const orderTable=(items)=>`<div class="tblwrap"><table>
    <thead><tr><th>วันที่สั่ง</th><th>เลข TR/PO</th><th>คลัง/ชนิด</th><th>ชื่อสินค้า</th><th>วันที่ส่ง</th><th>สถานะ</th><th>หมายเหตุ</th>${canEdit&&!shareMode?'<th></th>':''}</tr></thead>
    <tbody>${items.map(o=>{
      const sm=statusMeta(o.status);
      return `<tr>
        <td class="small">${fmtDate(o.orderDate)}</td>
        <td><b class="small">${esc(o.docType)}</b><div class="small muted">${esc(o.docNo)}</div></td>
        <td class="small th">${o.category==='dry'?esc(o.warehouse):esc(o.freshType)}</td>
        <td class="th">${esc(o.product)}</td>
        <td class="small">${fmtDate(o.deliveryDate)}</td>
        <td><span class="status ${sm.cls}" ${canEdit&&!shareMode?`data-cyc="${o.id}"`:''} title="${canEdit&&!shareMode?'คลิกเพื่อเปลี่ยนสถานะ':''}"><span class="dot ${sm.cls}"></span>${sm.label}</span></td>
        <td class="small th muted">${esc(o.note||'—')}</td>
        ${canEdit&&!shareMode?`<td class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-edit-o="${o.id}">แก้</button><button class="btn sm ghost" data-del-o="${o.id}">ลบ</button></td>`:''}
      </tr>`}).join('')}</tbody></table></div>`;

  let html=`<div class="card"><div class="grouphead">ออเดอร์ที่สาขาสั่ง (PO / TR)`;
  if(shareMode)html+=` <span class="pill">เฉพาะเดือนนี้</span>`;
  html+=`<span class="line"></span>${canEdit&&!shareMode?`<button class="btn sm gold" id="addOrder">+ เพิ่มออเดอร์</button>`:''}</div>`;
  if(!list.length){html+=`<div class="empty th">ยังไม่มีออเดอร์${shareMode?'ในเดือนนี้':''}</div>`}
  else{
    html+=`<div class="grouphead" style="font-size:.75rem"><span class="tag dry">ของแห้ง</span><span class="line"></span></div>`;
    html+= dry.length?orderTable(dry):`<div class="empty th small">— ไม่มีรายการของแห้ง —</div>`;
    freshGroups.forEach(g=>{
      html+=`<div class="grouphead" style="font-size:.75rem"><span class="tag fresh">ของสด</span> <span class="th">${esc(g.ft)}</span><span class="line"></span></div>`+orderTable(g.items);
    });
    if(!freshGroups.length){html+=`<div class="grouphead" style="font-size:.75rem"><span class="tag fresh">ของสด</span><span class="line"></span></div><div class="empty th small">— ไม่มีรายการของสด —</div>`}
  }
  html+=`</div>`;
  $('#ordersCard').innerHTML=html;

  if(canEdit&&!shareMode){
    const ab=$('#addOrder');if(ab)ab.onclick=()=>orderModal(b,null);
    $$('#ordersCard [data-edit-o]').forEach(x=>x.onclick=()=>orderModal(b,DB.orders.find(o=>o.id===x.dataset.editO)));
    $$('#ordersCard [data-del-o]').forEach(x=>x.onclick=()=>confirmDialog('ลบออเดอร์นี้?',()=>{DB.orders=DB.orders.filter(o=>o.id!==x.dataset.delO);saveDB();drawOrders(b,u,opt);toast('ลบแล้ว')},{danger:true,yes:'ลบ'}));
    $$('#ordersCard [data-cyc]').forEach(x=>x.onclick=()=>{
      const o=DB.orders.find(o=>o.id===x.dataset.cyc);
      const order=['complete','cut','hold'];o.status=order[(order.indexOf(o.status)+1)%3];
      if(o.status==='complete')o.note='';saveDB();drawOrders(b,u,opt);
    });
  }
}

    <h2>ตั้งค่ารอบสั่ง–รับของ</h2><div class="small muted th" style="margin-bottom:.2rem">${esc(b.nameEn)} · ${b.code}</div>

const DROP_API='/api/drop';
const PORTAL_KEY='jc_drop_portal';
function fmtDT(iso){if(!iso)return '—';return new Date(iso).toLocaleString('th-TH',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function fmtSize(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function emailChip(e){e=e||{};
  if(e.status==='sent')return `<span class="estat sent" title="${esc((e.to||[]).join(', '))}">ส่งอีเมลแล้ว</span>`;
  if(e.status==='dry-run')return `<span class="estat wait" title="โหมดทดสอบ — ยังไม่ได้ส่งจริง">ทดสอบ (ไม่ส่งจริง)</span>`;
  if(e.status==='failed')return `<span class="estat failed" title="${esc(e.error||'')}">ส่งไม่สำเร็จ</span>`;
  return `<span class="estat wait">กำลังส่ง…</span>`;
}
async function dropFetch(path,opt,token){opt=opt||{};
  const r=await fetch(DROP_API+path,{...opt,headers:{...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status});
  return j;
}
async function openPdf(path,token){
  const w=window.open('','_blank');
  try{const r=await fetch(DROP_API+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw 0;
    const url=URL.createObjectURL(await r.blob()); if(w)w.location=url; else location.href=url;}
  catch(e){if(w)w.close();toast('เปิดไฟล์ไม่สำเร็จ')}
}
function copyText(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('คัดลอกแล้ว')).catch(()=>{window.prompt('คัดลอก:',t)})}

    <div style="height:1.2rem"></div>
    <div class="kicker" style="margin-bottom:.5rem">ใบสั่งที่ส่งแล้ว</div>
    <div class="card" style="padding:0"><div class="tblwrap"><table><thead><tr><th>วันที่</th><th>Ref</th><th>สาขา (จาก PO)</th><th>รายการ</th><th>ผู้สั่ง</th><th>สถานะ</th></tr></thead>
      <tbody>${P.drops.length?P.drops.map(x=>`<tr><td class="small" style="white-space:nowrap">${fmtDT(x.createdAt)}</td><td><b>${esc(x.ref)}</b>${x.poNumber?`<div class="small muted">${esc(x.poNumber)}</div>`:''}</td><td class="th">${esc(x.branchName)}</td><td>${esc(x.itemLabel)}</td><td class="th">${esc(x.issuerName)}</td><td>${x.email&&x.email.status==='failed'?'<span class="estat wait">ได้รับแล้ว · รอทีมส่งต่อ</span>':'<span class="estat sent">ได้รับแล้ว</span>'}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty th">ยังไม่มีใบสั่ง</div></td></tr>`}</tbody></table></div></div>`,
    me.account.name+' · '+me.account.username);
  $('#pOut').onclick=()=>{portalSave(null);PORTAL={tok:null,me:null,drops:[],file:null,busy:false};renderPortal()};
  const z=$('#fZ'), f=$('#fF');
  const setFile=file=>{
    if(!file)return;
    if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf'){$('#fMsg').textContent='รองรับเฉพาะไฟล์ PDF';return}
    if(file.size>me.maxBytes){$('#fMsg').textContent='ไฟล์ใหญ่เกิน '+fmtSize(me.maxBytes);return}
    P.file=file;$('#fMsg').textContent='';z.classList.add('has');$('#fZt').innerHTML=`📄 <b>${esc(file.name)}</b> <span class="muted small">${fmtSize(file.size)}</span><div class="small muted">คลิกเพื่อเปลี่ยนไฟล์</div>`;
  };
  z.onclick=()=>f.click(); f.onchange=()=>setFile(f.files[0]);
  z.ondragover=e=>{e.preventDefault();z.classList.add('over')}; z.ondragleave=()=>z.classList.remove('over');
  z.ondrop=e=>{e.preventDefault();z.classList.remove('over');setFile(e.dataTransfer.files[0])};
  $('#pForm').onsubmit=async e=>{e.preventDefault(); if(P.busy)return;
    if(!P.file){$('#fMsg').textContent='กรุณาแนบไฟล์ PDF';return}
    P.busy=true;const b=$('#fGo');b.disabled=true;b.textContent='กำลังอ่านและส่ง…';
    try{
      const qs=new URLSearchParams({filename:P.file.name});
      const j=await dropFetch('/portal/drops?'+qs,{method:'POST',headers:{'Content-Type':'application/pdf'},body:P.file},PORTAL.tok);
      const ds=j.drops||[j.drop];
      ds.slice().reverse().forEach(d=>P.drops.unshift(d));P.file=null;P.busy=false;drawPortal();
      openModal(`<div class="modal" style="max-width:440px;text-align:center"><div style="font-size:2rem">✓</div><h2>ส่งใบสั่งเรียบร้อย</h2>
        <p class="th" style="margin:.6rem 0">PO <b>${esc(ds[0].poNumber||'')}</b> · ${esc(ds[0].branchName)}<br>
        <span class="small muted">${ds.map(d=>esc(d.ref)+' · '+esc(d.itemLabel)).join('<br>')}</span></p>
        <button class="btn gold" onclick="closeModal()">ตกลง</button></div>`);
    }catch(err){P.busy=false;b.disabled=false;b.textContent='ส่งใบสั่ง';
      if(err.status===401){portalSave(null);PORTAL.me=null;renderPortal();return}
      $('#fMsg').textContent='ส่งไม่สำเร็จ: '+err.message;}
  };
}


/* ---------- PO report (shared by franchise portal + back office) ---------- */
const RPT_EMPTY=()=>({from:'',to:'',branch:[],item:[],q:'',account:[]});
let RPT={f:RPT_EMPTY(),data:null,busy:false};
const rptQs=f=>{const u=new URLSearchParams();Object.entries(f).forEach(([k,v])=>{(Array.isArray(v)?v:[v]).forEach(x=>{if(x)u.append(k,x)})});return u.toString()};
document.addEventListener('click',e=>{document.querySelectorAll('.msel.open').forEach(m=>{if(!m.contains(e.target))m.classList.remove('open')})});
/* searchable multi-select dropdown: opts=[[value,label]], sel=array (mutated in place) */
function mountMsel(el,opts,sel,ph){
  el.innerHTML=`<button type="button" class="msel-btn"><span class="lbl"></span><span>▾</span></button>
    <div class="msel-panel"><input type="search" placeholder="ค้นหา…" autocomplete="off"><div class="msel-tools"><a data-all>เลือกทั้งหมด</a><a data-none>ล้างที่เลือก</a></div><div class="msel-list"></div></div>`;
  const q=el.querySelector('input'),list=el.querySelector('.msel-list'),lbl=el.querySelector('.lbl');
  const nm=t=>String(t).toLowerCase();
  const shown=()=>opts.filter(o=>nm(o[1]).includes(nm(q.value.trim())));
  const label=()=>{const n=sel.length;lbl.innerHTML=n?(n<=2?esc(sel.map(v=>(opts.find(o=>o[0]===v)||[v,v])[1]).join(', ')):`เลือกแล้ว ${n} รายการ`):`<span class="ph">${ph}</span>`};
  const draw=()=>{const r=shown();list.innerHTML=r.length?r.map(o=>`<label><input type="checkbox" value="${esc(o[0])}" ${sel.includes(o[0])?'checked':''}> <span class="th">${esc(o[1])}</span></label>`).join(''):'<div class="empty th small" style="padding:.8rem">ไม่พบรายการ</div>';label()};
  el.querySelector('.msel-btn').onclick=()=>{el.classList.toggle('open');if(el.classList.contains('open'))q.focus()};
  q.oninput=draw;
  list.onchange=e=>{const v=e.target.value,i=sel.indexOf(v);if(e.target.checked){if(i<0)sel.push(v)}else if(i>=0)sel.splice(i,1);label()};
  el.querySelector('[data-all]').onclick=()=>{shown().forEach(o=>{if(!sel.includes(o[0]))sel.push(o[0])});draw()};
  el.querySelector('[data-none]').onclick=()=>{sel.length=0;draw()};
  draw();
}
const fmtMoney=n=>n==null||n===''?'':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function rptDay(iso){return new Date(iso).toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit',timeZone:'Asia/Bangkok'})}
function renderReport(el,opt){
  const f=RPT.f, d=RPT.data;
  const rows=d?d.rows:[];
  const pos=new Set(rows.filter(r=>r.poNumber).map(r=>r.poNumber)).size;
  const sum=rows.reduce((x,r)=>x+(+r.total||0),0);
  const ms=(k,label)=>`<div class="field"><label>${label}</label><div class="msel" data-ms="${k}"></div></div>`;
  el.innerHTML=`
    <div class="card" style="margin-bottom:1rem"><div class="rptbar">
      <div class="field"><label>ตั้งแต่วันที่</label><input type="date" id="rf_from" value="${esc(f.from)}"></div>
      <div class="field"><label>ถึงวันที่</label><input type="date" id="rf_to" value="${esc(f.to)}"></div>
      ${ms('branch','สาขา (จาก PO)')}
      ${ms('item','ประเภทสินค้า')}
      ${opt.admin?ms('account','บัญชีแฟรนไชส์'):''}
      <div class="field"><label>ค้นหา (เลข PO / สินค้า)</label><input id="rf_q" value="${esc(f.q)}" placeholder="เช่น PO2026… หรือ Yogurt"></div>
      <div class="field"><button class="btn gold" id="rf_go">ค้นหา</button></div>
      <div class="field"><button class="btn ghost" id="rf_clear" type="button">ล้างตัวกรอง</button></div>
      <div class="field"><button class="btn ghost" id="rf_csv" type="button" ${rows.length?'':'disabled'}>ดาวน์โหลด Excel (CSV)</button></div>
    </div>
    <div class="rptsum th"><div class="muted small">จำนวน PO</div><div class="muted small">จำนวนรายการ</div><div class="muted small">ยอดรวม (บาท)</div></div></div>
    <div class="card" style="padding:0"><div class="tblwrap"><table class="rpt"><thead><tr><th>วันที่ส่ง</th><th>PO / Ref</th><th>สาขา (จาก PO)</th><th>ประเภท</th><th>รายการสินค้า</th><th class="num">จำนวน</th><th>หน่วย</th><th class="num">ราคา</th><th class="num">รวม</th><th>ผู้ออกใบสั่ง</th>${opt.admin?'<th>บัญชี</th>':''}</tr></thead>
    <tbody>${!d?`<tr><td colspan="11"><div class="empty th">กำลังโหลด…</div></td></tr>`:rows.length?rows.map(r=>`<tr><td class="small" style="white-space:nowrap">${rptDay(r.createdAt)}</td><td><b>${esc(r.poNumber||'—')}</b><div class="small muted">${esc(r.ref)}</div></td><td class="th">${esc(r.branch)}</td><td>${esc(r.itemLabel)}</td>
      <td class="th">${r.hasDetail?esc(r.product):'<span class="muted small">ไม่มีรายละเอียด PO (ส่งก่อนระบบอ่าน PO)</span>'}</td><td class="num">${r.qty==null?'':esc(r.qty)}</td><td>${esc(r.unit)}</td><td class="num">${fmtMoney(r.price)}</td><td class="num">${fmtMoney(r.total)}</td><td class="th">${esc(r.issuer)}</td>${opt.admin?`<td class="small">${esc(r.account)}</td>`:''}</tr>`).join(''):`<tr><td colspan="11"><div class="empty th">ไม่พบข้อมูลตามตัวกรอง</div></td></tr>`}</tbody></table></div></div>
    ${d&&d.truncated?'<div class="small muted th" style="margin-top:.5rem">แสดง 5,000 รายการแรก — ใช้ตัวกรองเพื่อจำกัดข้อมูล</div>':''}`;
  // summary numbers (rendered after to keep markup simple)
  const sm=el.querySelector('.rptsum');
  sm.innerHTML=`<div><div class="muted small th">จำนวน PO</div><b>${pos}</b></div><div><div class="muted small th">จำนวนรายการสินค้า</div><b>${rows.filter(r=>r.hasDetail).length}</b></div><div><div class="muted small th">ยอดรวม (บาท)</div><b>${fmtMoney(sum)}</b></div>`;
  const read=()=>{f.from=$('#rf_from').value;f.to=$('#rf_to').value;f.q=$('#rf_q').value.trim()};
  mountMsel(el.querySelector('[data-ms=branch]'),(d?d.branches:[]).map(b=>[b,b]),f.branch,'ทั้งหมด');
  mountMsel(el.querySelector('[data-ms=item]'),(d?d.items:[]).map(i=>[i.key,i.label]),f.item,'ทั้งหมด');
  if(opt.admin)mountMsel(el.querySelector('[data-ms=account]'),(d&&d.accounts||[]).map(a=>[a.id,a.name+' ('+a.username+')']),f.account,'ทั้งหมด');
  const load=()=>{read();RPT.data=null;RPT.busy=false;renderReport(el,opt)};
  $('#rf_go').onclick=load;
  $('#rf_q').onkeydown=e=>{if(e.key==='Enter')load()};
  $('#rf_clear').onclick=()=>{RPT.f=RPT_EMPTY();load()};
  $('#rf_csv').onclick=()=>{
    const head=['วันที่ส่ง','Ref','PO','สาขา (จาก PO)','ประเภท','วันที่ออก PO','ลำดับ','รายการสินค้า','จำนวน','หน่วย','VAT','ราคา','รวม','ผู้ออกใบสั่ง','บัญชี'];
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const csv='﻿'+[head,...rows.map(r=>[r.day,r.ref,r.poNumber,r.branch,r.itemLabel,r.issuedDate,r.no,r.product,r.qty,r.unit,r.vat,r.price,r.total,r.issuer,r.account])].map(l=>l.map(q).join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='po-report-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();
  };
  if(!d&&!RPT.busy){RPT.busy=true;
    opt.fetch(rptQs(f)).then(j=>{RPT.busy=false;RPT.data=j;renderReport(el,opt)}).catch(e=>{RPT.busy=false;if(opt.on401&&e.status===401)return opt.on401();el.innerHTML=`<div class="card"><div class="empty th">โหลดรายงานไม่ได้ <span class="small muted">(${esc(e.message)})</span></div></div>`});
  }
}
function drawPortalReport(){
  const me=PORTAL.me;
  $('#app').innerHTML=portalShell(`<div class="pagehead"><div><div class="kicker">Report</div><h1 class="th">รายงาน PO</h1><div class="muted th small">รายละเอียดสินค้าใน PO ที่ส่งแล้ว เลือกดูตามวันที่และสาขาได้</div></div></div><div id="rptBox"></div>`,me.account.name+' · '+me.account.username,'report');
  $('#pOut').onclick=()=>{portalSave(null);PORTAL={tok:null,me:null,drops:[],file:null,busy:false};RPT.data=null;location.hash='#/drop';renderPortal()};
  RPT.data=null;RPT.busy=false;
  renderReport($('#rptBox'),{admin:false,fetch:qs=>dropFetch('/portal/report?'+qs,{},PORTAL.tok),on401:()=>{portalSave(null);PORTAL.me=null;renderPortal()}});
}

/* ---------- boot ---------- */
const APP_TITLE=document.title;
window.addEventListener('hashchange',()=>{closeModal();render()});
if(parseHash().parts[0]==='drop') render(); else loadDB().then(render);
</script>
